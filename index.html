<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="theme-color" content="#ffffff">
      <title>My Static Website</title>
      <style>
         *,
         *::before,
         *::after {
            box-sizing: border-box;
         }

         body {
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            display: grid;
            place-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.5;
            text-align: center;
         }

         main {
            width: min(100%, 40rem);
         }

         h1 {
            font-size: clamp(1.75rem, 6vw, 3rem);
            line-height: 1.2;
            overflow-wrap: anywhere;
         }

         p {
            font-size: clamp(1rem, 3.5vw, 1.25rem);
         }

         .home-button {
            display: inline-block;
            max-width: 100%;
            min-height: 44px;
            padding: 0.75rem 1.25rem;
            border: 0;
            border-radius: 0.5rem;
            background: #1464f4;
            color: #fff;
            font: inherit;
            font-weight: 600;
            text-decoration: none;
            overflow-wrap: anywhere;
         }

         .home-button:focus-visible {
            outline: 3px solid #111;
            outline-offset: 3px;
         }

         @media (max-width: 480px) {
            body {
               padding: 1rem;
            }
         }
      </style>
   </head>
   <body>
      <main>
         <h1>Welcome to my static website! ⭐️</h1>
         <p>How was your day? 🎉</p>
         <a class="home-button" href="https://linkaja.id/applink/aci/dashboard/">
            LinkAja Home
         </a>
      </main>
   </body>
</html>
